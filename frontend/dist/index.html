    <style>
      :root {
        color-scheme: dark;
        background: #080b0f;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background:
          radial-gradient(circle at top left, rgba(125, 211, 199, 0.1), transparent 34%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.035), transparent 24%),

      }

      .app-boot {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;

      }

      .app-boot__panel {
        display: grid;
        justify-items: center;
        gap: 16px;
        text-align: center;
      }

      .app-boot__mark {
        position: relative;
        width: 48px;
        height: 48px;
        border-radius: 12px;
        border: 1px solid rgba(125, 211, 199, 0.3);
        background: rgba(125, 211, 199, 0.1);
      }

      .app-boot__mark::after {
        position: absolute;
        inset: 10px;
        border: 2px solid rgba(125, 211, 199, 0.18);
        border-top-color: #7dd3c7;
        border-radius: 999px;
        content: "";
        animation: app-boot-spin 0.9s linear infinite;
      }

      .app-boot__title {
        margin: 0;
        color: #f8fafc;
        font-size: 18px;
        font-weight: 650;
      }

      .app-boot__text {
        margin: 0;
        color: #94a3b8;
        font-size: 13px;
      }

      @keyframes app-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
