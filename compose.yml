services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env.docker
    environment:
      TRUSTED_KNOWLEDGE_SKILL_STORAGE_DIR: /app/backend/data/skills
      TRUSTED_KNOWLEDGE_MEDIA_STORAGE_DIR: /app/backend/data/media
      TRUSTED_KNOWLEDGE_ALLOW_WEB_CODEX: "false"
      TRUSTED_KNOWLEDGE_ALLOW_WEB_RESTART: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend_data:/app/backend/data
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8022/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${TRUSTED_KNOWLEDGE_HOST_PORT:-8021}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  backend_data:
  app_logs:
